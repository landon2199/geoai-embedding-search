name: geoai-embed
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy=2.5.4
  - pandas=3.0.6
  - scikit-learn=1.9.1
  - matplotlib=3.11.2
  - xarray=2026.9.0
  - dask-core=2026.8.0
  - rasterio=1.5.2
  - rioxarray=0.23.0
  - pyproj=3.8.0
  - pystac-client=0.9.1
  - planetary-computer=1.0.0
  - odc-stac=0.5.3
  - odc-geo=0.5.3
  - umap-learn=0.5.12
  - pytest=9.1.1
  - pip:
      # CUDA 12.6 build of PyTorch; for CPU-only drop the extra index
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.1
      - torchvision==0.29.1
      - torchgeo==0.10.1
      - timm==1.0.30
